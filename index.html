<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>Speedway Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  /* Look: dark stat cards like Speedway Manager, speedway blue accent. */
  :root {
    /* PGE Ekstraliga broadcast colours */
    --bg: #060608;
    --card: #101015;
    --card2: #16161d;
    --line: #23232d;
    --text: #f4f4f8;
    --dim: #8d8ca3;
    --faint: #5b5a70;
    --accent: #4ff2c4;          /* mint */
    --accent-hi: #4ff2c4;
    --accent-soft: rgba(79,242,196,.12);
    --ink: #2a0e74;             /* dark purple lettering on mint */
    --purple: #6d28d9;
    --purple-hi: #9b6bff;
    --head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --tile-bg: var(--purple);
    --tile-fg: #fff;
    --live: #f43f5e;
    --red: #f87171;
    --gold: #facc15;
    --silver: #cbd5e1;
    --bronze: #d97706;
    --g-red: #ef4444;
    --g-blue: #3b82f6;
    --g-white: #e5e7eb;
    --g-yellow: #facc15;
    --font: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Individual meetings: SGP broadcast colours (lime, charcoal, white). Team meetings keep the Ekstraliga look. */
  body[data-theme="sgp"] {
    --bg: #0a0a0a;
    --card: #141414;
    --card2: #1b1b1b;
    --line: #2a2a2a;
    --dim: #9a9a9a;
    --faint: #5f5f5f;
    --accent: #e3f22b;
    --accent-hi: #e3f22b;
    --accent-soft: rgba(227,242,43,.12);
    --ink: #111111;
    --purple: #3a3a3a;
    --purple-hi: #ffffff;
    --tile-bg: #e3f22b;
    --tile-fg: #111111;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); min-height: 100vh; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 14px 14px 40px; }

  /* top line */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .brand { font: 800 italic 20px var(--head); text-transform: uppercase; letter-spacing: .02em; }
  .brand .logo { width: 26px; height: 22px; background: var(--accent); display: grid; place-items: center; font: 900 italic 15px var(--head); color: var(--ink);
                 clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .picker { position: relative; }
  .picker select { appearance: none; -webkit-appearance: none; background: var(--card); color: var(--text); border: 1px solid var(--line);
                   border-radius: 4px; padding: 8px 30px 8px 12px; font: 500 13px var(--font); max-width: 55vw; cursor: pointer; }
  .picker::after { content: "▾"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; font-size: 12px; }

  /* broadcast tag: [ BIEG 12 | 1/4 ] */
  .tagbar { display: inline-flex; align-items: stretch; height: 34px; margin: 0 0 14px; font: 800 italic 20px/1 var(--head); text-transform: uppercase; letter-spacing: .01em; }
  .tagbar .a { background: var(--accent); color: var(--ink); padding: 0 18px 0 16px; display: flex; align-items: center;
               clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
  .tagbar .b { background: #000; color: var(--accent); padding: 0 18px 0 14px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-left: 0;
               clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
  .tagbar .b.live { color: var(--live); }
  .titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .titlerow .right { font-size: 12px; color: var(--dim); padding-top: 9px; }

  /* cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 14px; }
  .card-title { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 18px; font-weight: 700; }
  .badge { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 8px; background: var(--card2); border: 1px solid var(--line);
           color: var(--accent-hi); font-size: 14px; font-weight: 700; display: grid; place-items: center; }
  .card-title .right { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--dim); }

  /* meeting header */
  .meet { display: flex; align-items: stretch; background: #000; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .meet .tile { width: 58px; flex: none; background: var(--tile-bg); display: grid; place-items: center; font: 900 italic 26px var(--head); color: var(--tile-fg); }
  .meet .body { padding: 12px 16px; min-width: 0; flex: 1; }
  .meet-name { font: 900 italic 30px/1 var(--head); text-transform: uppercase; margin: 0; word-break: break-word; letter-spacing: .01em; }
  .meet-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 8px; color: var(--dim); font-size: 13px; }
  .meet-meta b { color: var(--text); font-weight: 500; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .status.running { background: rgba(244,63,94,.14); color: var(--live); }
  .status.finished { background: rgba(250,204,21,.12); color: var(--gold); }
  .status.setup { background: var(--accent-soft); color: var(--accent-hi); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .prog { display: flex; align-items: center; gap: 8px; }
  .prog .bar { width: 110px; height: 5px; border-radius: 9px; background: var(--line); overflow: hidden; }
  .prog .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--purple-hi), var(--accent)); border-radius: 9px; transition: width .5s; }

  /* tabs */
  .tabs { display: flex; gap: 6px; margin: 0 0 14px; position: sticky; top: 0; z-index: 5; padding: 8px 0; background: var(--bg); }
  .tabs button { border: 0; background: var(--card2); color: var(--dim); padding: 9px 20px; font: 800 italic 17px var(--head); text-transform: uppercase;
                 cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .tabs button.on { background: var(--accent); color: var(--ink); }

  /* stat tables (the Speedway Manager look) */
  .cols { display: grid; grid-template-columns: 1fr; gap: 0 28px; }
  @media (min-width: 820px) { .cols.two { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 819px) { .cols.two > div + div .thead { display: none; } }
  .thead, .trow { display: grid; grid-template-columns: 22px minmax(0, 1.5fr) minmax(0, 1.2fr) 34px; gap: 10px; align-items: center; }
  .thead { color: var(--dim); font-size: 12px; font-weight: 500; padding: 0 4px 8px; border-bottom: 1px solid var(--line); }
  .trow { padding: 9px 4px; border-bottom: 1px solid var(--line); position: relative; }
  .trow:last-child { border-bottom: 0; }
  .trow .pl { color: var(--faint); font-size: 12px; font-weight: 600; text-align: right; }
  .trow .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .nm small { color: var(--faint); font-weight: 500; margin-right: 5px; }
  .trow .sub { color: var(--dim); font-size: 11px; margin-top: 1px; }
  .trow .heats { font-size: 13px; font-weight: 500; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .heats .c { color: var(--red); font-weight: 700; }
  .heats .n { color: var(--faint); }
  .trow .pts { text-align: right; font: 900 italic 20px var(--head); color: var(--accent); }
  .r { text-align: right; }
  .trow.zf::before, .trow.zl::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; }
  .trow.zf::before { background: var(--accent); }
  .trow.zl::before { background: var(--purple-hi); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend b { color: var(--red); margin-right: 3px; }

  /* heats */
  .hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .heat { background: var(--card2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px 6px; }
  .heat.live { border-color: rgba(244,63,94,.6); }
  .heat.next { border-color: rgba(79,242,196,.55); }
  .heat.wait { opacity: .75; }
  .hh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .hh .t { font: 800 italic 17px var(--head); text-transform: uppercase; }
  .heat.done .hh .t { color: var(--text); }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; display: inline-flex; align-items: center; gap: 5px; }
  .tag.live { color: var(--live); background: rgba(244,63,94,.14); }
  .tag.next { color: var(--ink); background: var(--accent); }
  .tag.done { color: var(--dim); background: rgba(255,255,255,.05); }
  .hr { display: grid; grid-template-columns: 10px 22px minmax(0, 1fr) auto 26px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .hr:first-of-type { border-top: 0; }
  .gd { width: 10px; height: 10px; border-radius: 3px; }
  .gd.red { background: var(--g-red); } .gd.blue { background: var(--g-blue); } .gd.white { background: var(--g-white); } .gd.yellow { background: var(--g-yellow); }
  .hr .no { color: var(--faint); font-size: 12px; text-align: right; }
  .hr .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hr.win .nm { font-weight: 700; }
  .hr .tm { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .hr .ps { text-align: right; font: 900 italic 18px var(--head); color: var(--accent); }
  .hr .ps.c { color: var(--red); }
  .stage { color: var(--purple-hi); font: 800 italic 15px var(--head); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 10px; }
  .stage:first-child { margin-top: 0; }

  /* live panel */
  .spot { border-color: var(--line); }
  .spot.live { border-color: rgba(244,63,94,.55); }
  .spot .hr { font-size: 15px; padding: 8px 0; grid-template-columns: 12px 26px minmax(0, 1fr) auto; }
  .spot .gd { width: 12px; height: 12px; }
  .spot .tot { color: var(--dim); font-size: 12px; }
  .spot .tot b { color: var(--accent); font: 900 italic 20px var(--head); margin-right: 2px; }
  .spot .nm { font: 700 italic 20px var(--head); text-transform: uppercase; letter-spacing: .02em; }

  /* podium */
  .podium { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 8px; align-items: end; margin-bottom: 14px; }
  .step { background: var(--card2); border: 1px solid var(--line); border-radius: 4px; padding: 12px 8px; text-align: center; border-top: 3px solid; }
  .step.s1 { border-top-color: var(--gold); padding-top: 20px; } .step.s2 { border-top-color: var(--silver); } .step.s3 { border-top-color: var(--bronze); }
  .step .pos { font: 900 italic 30px var(--head); }
  .step.s1 .pos { color: var(--gold); font-size: 40px; } .step.s2 .pos { color: var(--silver); } .step.s3 .pos { color: var(--bronze); }
  .step .nm { font-weight: 600; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .sub { color: var(--dim); font-size: 12px; }
  .note { color: var(--dim); font-size: 12px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }

  /* team match score bar (like the TV one) */
  .scorebar { display: flex; align-items: stretch; background: #000; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .scorebar .tm { flex: 1; display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0; }
  .scorebar .tm.away { flex-direction: row-reverse; text-align: right; }
  .scorebar .tile { width: 44px; height: 44px; flex: none; background: var(--purple); display: grid; place-items: center; font: 900 italic 22px var(--head); color: #fff; }
  .scorebar .tn { font: 800 italic 20px/1.05 var(--head); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  .scorebar .tn small { display: block; color: var(--dim); font: 500 11px var(--font); text-transform: none; margin-top: 2px; }
  .scorebar .sc { display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 900 italic 40px/1 var(--head); }
  .scorebar .sc i { width: 4px; height: 34px; background: var(--accent); }
  .scorebar .lead { color: var(--accent); }
  .teamhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font: 800 italic 18px var(--head); text-transform: uppercase; }
  .teamhead b { color: var(--accent); font-size: 26px; }
  .tthead, .ttrow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.1fr) 30px 22px; gap: 8px; align-items: center; }
  .tthead { color: var(--dim); font-size: 12px; padding: 0 2px 8px; border-bottom: 1px solid var(--line); }
  .ttrow { padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .ttrow:last-child { border-bottom: 0; }
  .ttrow .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ttrow .nm small { color: var(--faint); font-weight: 500; margin-right: 5px; }
  .ttrow .sub { color: var(--dim); font-size: 11px; margin-top: 1px; }
  .ttrow .heats { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ttrow .pts { text-align: right; font: 900 italic 18px var(--head); color: var(--accent); }
  .ttrow .b { text-align: right; color: var(--dim); font-size: 12px; }
  .hscore { font: 900 italic 16px var(--head); color: var(--accent); }
  .hscore small { color: var(--dim); font: 500 11px var(--font); margin-left: 6px; }
  .side-h { color: var(--accent); } .side-a { color: var(--purple-hi); }
  .winner { text-align: center; padding: 14px; margin-bottom: 12px; background: var(--accent-soft); border-radius: 4px; font: 900 italic 22px var(--head); text-transform: uppercase; color: var(--accent); }
  @media (max-width: 480px) { .scorebar .tn { white-space: normal; word-break: break-word; font-size: 14px; } }
  @media (max-width: 480px) { .scorebar .sc { font-size: 30px; padding: 0 8px; } .scorebar .tile { width: 34px; height: 34px; font-size: 17px; } .scorebar .tn { font-size: 16px; } .scorebar .tm { padding: 10px 8px; gap: 8px; } }

  /* league */
  .ltable, .lstats { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ltable th, .lstats th { color: var(--dim); font-weight: 500; font-size: 12px; text-align: right; padding: 0 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ltable td, .lstats td { text-align: right; padding: 9px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ltable th:nth-child(2), .ltable td:nth-child(2), .lstats th:nth-child(2), .lstats td:nth-child(2), .lstats td:nth-child(3), .lstats th:nth-child(3) { text-align: left; }
  .ltable td:nth-child(2) { font-weight: 600; }
  .ltable td.pos { color: var(--faint); font-weight: 600; position: relative; }
  .ltable tr.pa td.pos { box-shadow: inset 3px 0 0 var(--accent); }
  .ltable tr.pb td.pos { box-shadow: inset 3px 0 0 var(--purple-hi); }
  .ltable td.pts, .lstats td.avg { font: 900 italic 18px var(--head); color: var(--accent); }
  .lstats td.nm { font-weight: 600; }
  .lstats td.tm { color: var(--dim); }
  .lstats tr.sep td { color: var(--purple-hi); font: 800 italic 14px var(--head); text-transform: uppercase; text-align: left; padding-top: 16px; }
  .xscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fx { display: grid; grid-template-columns: 34px minmax(0,1fr) 92px minmax(0,1fr); gap: 10px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .fx .id { color: var(--faint); font-size: 12px; }
  .fx .h { text-align: right; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx .a { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx .s { text-align: center; font: 900 italic 18px var(--head); color: var(--accent); }
  .fx .s.vs { color: var(--faint); font: 600 12px var(--font); }
  .fx .s small { display: block; color: var(--dim); font: 500 10px var(--font); }
  .fx.live { cursor: pointer; background: rgba(244,63,94,.08); }
  .fx.win-h .h, .fx.win-a .a { color: var(--accent); }

  .empty { color: var(--dim); text-align: center; padding: 30px 10px; }
  footer { text-align: center; color: var(--faint); font-size: 11px; margin-top: 20px; }
  footer .dot { display: inline-block; color: #22c55e; margin-right: 5px; vertical-align: 1px; width: 6px; height: 6px; }
  footer.off .dot { color: var(--live); }

  @media (max-width: 480px) {
    .wrap { padding: 10px 10px 30px; }
    .card { padding: 14px 12px; }
    .trow.zf::before, .trow.zl::before { left: -12px; }
    .thead, .trow { grid-template-columns: 18px minmax(0, 1.4fr) minmax(0, 1fr) 28px; gap: 8px; }
    .meet-name { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo">S</span>Speedway Live</div>
    <div class="picker"><select id="picker" aria-label="Competition"></select></div>
  </div>
  <div id="meet"></div>
  <div id="spot"></div>
  <div class="tabs">
    <button data-tab="standings">Standings</button>
    <button data-tab="program">Heats</button>
    <button data-tab="results">Results</button>
  </div>
  <div id="view"></div>
  <footer id="foot"><span class="dot"></span>Connecting…</footer>
</div>

<!-- Only on the free hosted site: config.js says where the live data is. On the Minecraft server it's simply missing. -->
<script src="config.js"></script>
<script>
let data = { competitions: [] };
let chosen = null;
let tab = location.hash.slice(1);
if (!["standings", "program", "results"].includes(tab)) tab = "standings";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const CODES = { D: "defekt", U: "upadek (fall)", W: "wykluczenie (excluded)", T: "taśma (tape)" };
const isCode = v => /^[DUWT]$/.test(v);
/** Broadcast-style tag: [ LEFT | right ] */
const tagbar = (left, right, live) => `<div class="tagbar"><span class="a">${left}</span>${right != null ? `<span class="b ${live ? "live" : ""}">${right}</span>` : ""}</div>`;

/** What happened to each rider in one heat: { number: { place, points } or { code } } */
function outcome(h) {
  const out = {};
  if (!h.result) return out;
  h.result.order.forEach((r, i) => out[r.number] = { place: i + 1, points: r.points, timeMs: r.timeMs, bonus: r.bonus });
  h.result.excluded.forEach(r => out[r.number] = { code: r.code || "W" });
  return out;
}

/** Final / LCQ places, same rules as the plugin. */
function zone(place, riders) {
  if (riders >= 10) return place <= 2 ? "zf" : place <= 10 ? "zl" : "";
  if (riders >= 8) return place <= 2 ? "zf" : place <= 6 ? "zl" : "";
  return place <= 4 ? "zf" : "";
}

// Hosted site (GitHub/Cloudflare Pages): read from Supabase. On the Minecraft server: read data.json.
const CLOUD = window.MLZ_CLOUD && window.MLZ_CLOUD.url ? window.MLZ_CLOUD : null;
let lastStamp = null;

async function loadData() {
  if (!CLOUD) {
    const res = await fetch("data.json", { cache: "no-store" });
    if (!res.ok) throw new Error(location.hostname.endsWith("github.io")
      ? "config.js didn't load (check the file name and that it's next to index.html)"
      : "server answered " + res.status);
    return await res.json();
  }
  const base = CLOUD.url.replace(/\/+$/, "") + "/rest/v1/live_data?id=eq.main&select=";
  const headers = { apikey: CLOUD.key };
  // First a tiny request: has anything changed? Only then download everything (keeps the free plan happy).
  const check = await fetch(base + "updated_at", { headers, cache: "no-store" });
  if (!check.ok) {
    let why = "";
    try { const body = await check.json(); why = body.message || body.hint || ""; } catch (e) { }
    throw new Error("Supabase said " + check.status + (why ? ": " + why : "") +
      (check.status === 401 ? " (wrong key in config.js? use the publishable key)" : ""));
  }
  const stamp = await check.json();
  if (!stamp.length) throw new Error("no data yet (is the plugin sending?)");
  if (stamp[0].updated_at === lastStamp) return null;
  const rows = await (await fetch(base + "json", { headers, cache: "no-store" })).json();
  lastStamp = stamp[0].updated_at;
  return rows[0].json;
}

async function refresh() {
  try {
    const fresh = await loadData();
    if (!fresh) return; // nothing changed
    data = fresh;
    render();
    $("foot").className = "";
    $("foot").innerHTML = `<span class="dot"></span>Live · updated ${new Date(data.updated).toLocaleTimeString()}`;
  } catch (e) {
    $("foot").className = "off";
    // Show WHY, so problems can be fixed without guessing.
    const why = e && e.message ? e.message : String(e);
    $("foot").innerHTML = `<span class="dot"></span>Can't reach the server, retrying… <br><small>${esc(why)}${CLOUD ? " · " + esc(CLOUD.url) : ""}</small>`;
  }
}

function pickDefault() {
  const comps = data.competitions;
  if (chosen && comps.some(c => c.name === chosen)) return;
  if (chosen && chosen.startsWith("L:") && (data.leagues || []).some(l => "L:" + l.name === chosen)) return;
  const running = comps.find(c => c.state === "running");
  const open = comps.filter(c => !c.closed);
  chosen = running ? running.name : open.length ? open[open.length - 1].name : comps[0] && comps[0].name;
}

function render() {
  pickDefault();
  const leagues = data.leagues || [];
  $("picker").innerHTML = `<optgroup label="Meetings">${data.competitions.map(c =>
      `<option value="${esc(c.name)}" ${c.name === chosen ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</optgroup>`
    + (leagues.length ? `<optgroup label="Leagues">${leagues.map(l =>
      `<option value="L:${esc(l.name)}" ${"L:" + l.name === chosen ? "selected" : ""}>🏆 ${esc(l.name)}</option>`).join("")}</optgroup>` : "");
  $("picker").parentElement.style.display = data.competitions.length + leagues.length > 1 ? "" : "none";
  const league = chosen && chosen.startsWith("L:") ? leagues.find(l => "L:" + l.name === chosen) : null;
  setTabLabels(league ? ["Table", "Fixtures", "Stats"] : ["Standings", "Heats", "Results"]);
  if (league) { renderLeague(league); return; }
  const c = data.competitions.find(x => x.name === chosen);
  document.body.dataset.theme = c && c.type === "team" ? "pge" : "sgp";
  if (!c) {
    $("meet").innerHTML = ""; $("spot").innerHTML = "";
    $("view").innerHTML = `<div class="card empty">No competitions yet.</div>`;
    return;
  }
  renderMeet(c);
  renderSpot(c);
  ({ standings: renderStandings, program: renderHeats, results: renderResults })[tab](c);
}

function initials(name) {
  return esc(String(name || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase());
}

function renderMeet(c) {
  if (c.type === "team" && c.team) {
    const t = c.team, done = c.program.filter(h => h.result).length;
    const status = c.state === "running" ? `<span class="status running"><span class="dot"></span>Live</span>`
                 : c.state === "finished" ? `<span class="status finished">Finished</span>` : `<span class="status setup">Coming up</span>`;
    $("meet").innerHTML = `<div class="scorebar">
        <div class="tm"><div class="tile">${initials(t.homeName)}</div><div class="tn">${esc(t.homeName)}<small>Home</small></div></div>
        <div class="sc"><span class="${t.home > t.away ? "lead" : ""}">${t.home}</span><i></i><span class="${t.away > t.home ? "lead" : ""}">${t.away}</span></div>
        <div class="tm away"><div class="tile">${initials(t.awayName)}</div><div class="tn">${esc(t.awayName)}<small>Away</small></div></div>
      </div>
      <div class="meet-meta" style="margin:-4px 0 14px">${status}<span>${esc(c.name)}</span>${c.track ? `<span>Track <b>${esc(c.track)}</b></span>` : ""}
        <span>Set <b>${esc(t.set)}</b></span><span class="prog"><span class="bar"><i style="width:${Math.round(done / 15 * 100)}%"></i></span><b>${done}/15</b> heats</span></div>`;
    return;
  }
  const done = c.program.filter(h => h.result).length, total = c.program.length;
  const status = c.state === "running" ? `<span class="status running"><span class="dot"></span>Live</span>`
               : c.state === "finished" ? `<span class="status finished">Finished</span>`
               : `<span class="status setup">Coming up</span>`;
  $("meet").innerHTML = `<div class="meet"><div class="tile">${esc((c.name[0] || "S").toUpperCase())}</div><div class="body">
      <h1 class="meet-name">${esc(c.name)}</h1>
      <div class="meet-meta">${status}
        ${c.track ? `<span>Track <b>${esc(c.track)}</b></span>` : ""}
        <span><b>${c.standings.length}</b> riders</span>
        ${total ? `<span class="prog"><span class="bar"><i style="width:${Math.round(done / total * 100)}%"></i></span><b>${done}/${total}</b> heats</span>` : ""}
      </div></div></div>`;
}

function renderSpot(c) {
  const liveHeat = c.program.find(h => h.number === c.live);
  const heat = liveHeat || (c.state === "running" ? c.program.find(h => h.number === c.next) : null);
  if (!heat) { $("spot").innerHTML = ""; return; }
  const pts = Object.fromEntries(c.standings.map(s => [s.number, s.points]));
  $("spot").innerHTML = `<div class="card spot ${liveHeat ? "live" : ""}">
      ${tagbar(esc(heat.label), liveHeat ? `<span class="dot"></span>Live` : "Next", !!liveHeat)}
      ${heat.gates.map(g => `<div class="hr">
          <span class="gd ${esc(g.color)}"></span><span class="no">${g.number}</span>
          <span class="nm ${g.side === "home" ? "side-h" : g.side === "away" ? "side-a" : ""}">${esc(g.name)}${g.sub ? ` <small style="color:var(--dim);font-size:13px">${esc(g.sub)}</small>` : ""}</span>
          <span class="tot"><b>${pts[g.number] ?? 0}</b> pts</span></div>`).join("")}
    </div>`;
}

/** One standings row: place, rider + average, heats "3,2,D,1,3", points. */
function standingRow(s, riders, showZones) {
  const rode = s.perHeat.filter(p => p !== "-");
  const avg = rode.length ? (s.points / rode.length).toFixed(3) : "0.000";
  const heats = s.perHeat.map(p => p === "-" ? `<span class="n">–</span>` : isCode(p) ? `<span class="c" title="${esc(CODES[p])}">${p}</span>` : esc(p)).join(",");
  return `<div class="trow ${showZones ? zone(s.place, riders) : ""}">
      <span class="pl">${s.place}</span>
      <div><div class="nm"><small>${s.number}</small>${esc(s.name)}</div><div class="sub">${avg}</div></div>
      <span class="heats">${heats}</span>
      <span class="pts">${s.points}</span></div>`;
}

function statTable(rows) {
  return `<div><div class="thead"><span></span><span>Rider</span><span>Heats</span><span class="r">Pts</span></div>${rows}</div>`;
}

function teamCard(c, side) {
  const t = c.team, rows = c.standings.filter(s => s.side === side).sort((a, b) => a.number - b.number);
  const body = rows.map(s => {
    const rode = s.perHeat.filter(p => p !== "-");
    const avg = rode.length ? ((s.points + s.bonus) / rode.length).toFixed(3) : "0.000";
    const heats = s.perHeat.map(p => p === "-" ? `<span class="n">–</span>` : isCode(p) ? `<span class="c" title="${esc(CODES[p])}">${p}</span>` : esc(p)).join(",");
    return `<div class="ttrow"><div><div class="nm"><small>${s.number}</small>${esc(s.name)}</div><div class="sub">${avg}</div></div>
      <span class="heats">${heats || `<span class="n">–</span>`}</span><span class="pts">${s.points}</span><span class="b">${s.bonus || ""}</span></div>`;
  }).join("");
  return `<div><div class="teamhead"><span>${esc(side === "home" ? t.homeName : t.awayName)}</span><b>${side === "home" ? t.home : t.away}</b></div>
    <div class="tthead"><span>Rider</span><span>Heats</span><span class="r">Pts</span><span class="r">B</span></div>${body}</div>`;
}

function renderStandings(c) {
  if (c.type === "team" && c.team) {
    const done = c.program.filter(h => h.result).length;
    $("view").innerHTML = `<div class="card">
        <div class="titlerow">${tagbar("Rider stats", `${done}/15`)}<span class="right">avg = (pts + bonus) per ride</span></div>
        <div class="cols two">${teamCard(c, "home")}${teamCard(c, "away")}</div>
        <div class="legend"><span><b style="color:var(--accent)">2*</b>bonus point</span>${Object.entries(CODES).map(([k, v]) => `<span><b>${k}</b>${v}</span>`).join("")}</div>
      </div>`;
    return;
  }
  const n = c.standings.length;
  if (!n) { $("view").innerHTML = `<div class="card empty">No riders yet.</div>`; return; }
  const zones = c.state !== "setup";
  const done = c.program.filter(h => h.result && h.stage === "qualifying").length;
  const half = n > 8 ? Math.ceil(n / 2) : n;
  const left = c.standings.slice(0, half).map(s => standingRow(s, n, zones)).join("");
  const right = c.standings.slice(half).map(s => standingRow(s, n, zones)).join("");
  const zoneKey = !zones ? "" : n >= 8
    ? `<span><i style="background:var(--accent)"></i>Final</span><span><i style="background:var(--purple-hi)"></i>LCQ</span>`
    : `<span><i style="background:var(--accent)"></i>Final</span>`;
  $("view").innerHTML = `<div class="card">
      <div class="titlerow">${tagbar("Standings", `${done}/${c.program.filter(h => h.stage === "qualifying").length}`)}<span class="right">avg = points per ride</span></div>
      <div class="cols ${right ? "two" : ""}">${statTable(left)}${right ? statTable(right) : ""}</div>
      <div class="legend">${zoneKey}${Object.entries(CODES).map(([k, v]) => `<span><b>${k}</b>${v}</span>`).join("")}</div>
    </div>`;
}

function heatCard(c, h) {
  const out = outcome(h);
  const state = h.number === c.live ? "live" : h.number === c.next && c.state === "running" ? "next" : h.result ? "done" : "wait";
  const tag = state === "live" ? `<span class="tag live"><span class="dot"></span>Live</span>`
            : state === "next" ? `<span class="tag next">Next</span>` : state === "done" ? `<span class="tag done">Done</span>` : "";
  const hs = c.type === "team" && h.result ? `<span class="hscore">${h.result.home}:${h.result.away}<small>${h.result.homeTotal}:${h.result.awayTotal}</small></span>` : "";
  const waiting = !h.gates.length ? `<div class="hr"><span></span><span></span><span class="nm" style="color:var(--dim)">Waiting for nominations</span><span></span><span></span></div>` : "";
  return `<div class="heat ${state}"><div class="hh"><span class="t">${esc(h.label)}</span>${hs || tag}</div>${waiting}
    ${h.gates.map(g => {
      const o = out[g.number];
      const ps = !o ? "" : o.code ? `<span class="ps c" title="${esc(CODES[o.code])}">${o.code}</span>` : `<span class="ps">${o.points}${o.bonus ? "*" : ""}</span>`;
      const tm = o && o.timeMs != null ? (o.timeMs / 1000).toFixed(2) + "s" : "";
      return `<div class="hr ${o && o.place === 1 ? "win" : ""}"><span class="gd ${esc(g.color)}"></span><span class="no">${g.number}</span>
        <span class="nm ${g.side === "home" ? "side-h" : g.side === "away" ? "side-a" : ""}">${esc(g.name)}${g.sub ? ` <small style="color:var(--dim)">${esc(g.sub)}</small>` : ""}</span><span class="tm">${tm}</span>${ps || "<span></span>"}</div>`;
    }).join("")}</div>`;
}

function renderHeats(c) {
  if (!c.program.length) { $("view").innerHTML = `<div class="card empty">The heats are drawn when the meeting starts.</div>`; return; }
  const groups = c.type === "team"
    ? [["Heats 1-13", c.program.filter(h => h.stage === "team")], ["Nominated heats", c.program.filter(h => h.stage === "nominated")]]
    : [["Heats", c.program.filter(h => h.stage !== "lcq" && h.stage !== "final")],
                  ["Last chance qualifiers", c.program.filter(h => h.stage === "lcq")],
                  ["Final", c.program.filter(h => h.stage === "final")]];
  const done = c.program.filter(h => h.result).length;
  $("view").innerHTML = `<div class="card"><div class="titlerow">${tagbar("Heats", `${done}/${c.program.length}`)}<span class="right">gate colour = helmet</span></div>
      ${groups.filter(g => g[1].length).map(([t, hs]) => `<div class="stage">${t}</div><div class="hgrid">${hs.map(h => heatCard(c, h)).join("")}</div>`).join("")}
    </div>`;
}

function renderResults(c) {
  if (!c.classification.length) { $("view").innerHTML = `<div class="card empty">Results appear once the meeting starts.</div>`; return; }
  const finished = c.state === "finished";
  if (c.type === "team" && c.team) {
    const t = c.team;
    const banner = finished ? `<div class="winner">${t.home === t.away ? `Draw ${t.home}:${t.away}` : `${esc(t.home > t.away ? t.homeName : t.awayName)} win ${Math.max(t.home, t.away)}:${Math.min(t.home, t.away)}`}</div>`
                            : `<div class="note">Not finished yet. This is how it stands right now.</div>`;
    const rows = [...c.standings].sort((a, b) => b.points - a.points || b.bonus - a.bonus);
    $("view").innerHTML = `<div class="card">${tagbar("Results", finished ? "Final" : "So far")}${banner}
        <div class="thead"><span></span><span>Rider</span><span>Team</span><span class="r">Pts</span></div>
        ${rows.map((s, i) => `<div class="trow"><span class="pl">${i + 1}</span><div class="nm"><small>${s.number}</small>${esc(s.name)}</div>
          <span class="heats ${s.side === "home" ? "side-h" : "side-a"}">${esc(s.side === "home" ? t.homeName : t.awayName)}</span><span class="pts">${s.points}</span></div>`).join("")}
      </div>`;
    return;
  }
  const top = c.classification.slice(0, 3);
  const step = (p, cls) => `<div class="step ${cls}"><div class="pos">${p.place}</div><div class="nm">${esc(p.name)}</div><div class="sub">${p.points} pts</div></div>`;
  $("view").innerHTML = `<div class="card">
      ${tagbar("Results", finished ? "Final" : "So far")}
      ${finished ? "" : `<div class="note">Not finished yet. This is how it stands right now.</div>`}
      ${finished && top.length === 3 ? `<div class="podium">${step(top[1], "s2")}${step(top[0], "s1")}${step(top[2], "s3")}</div>` : ""}
      <div class="thead"><span></span><span>Rider</span><span>Reached</span><span class="r">Pts</span></div>
      ${c.classification.map(p => `<div class="trow">
          <span class="pl" style="${finished && p.place <= 3 ? `color:var(--${["gold", "silver", "bronze"][p.place - 1]})` : ""}">${p.place}</span>
          <div class="nm"><small>${p.number}</small>${esc(p.name)}</div>
          <span class="heats" style="color:var(--dim)">${esc(p.howFar)}</span>
          <span class="pts">${p.points}</span></div>`).join("")}
    </div>`;
}

function setTabLabels(labels) {
  document.querySelectorAll(".tabs button").forEach((b, i) => b.textContent = labels[i]);
}

function renderLeague(l) {
  document.body.dataset.theme = "pge";
  const played = l.fixtures.filter(f => f.played).length;
  $("meet").innerHTML = `<div class="meet"><div class="tile">🏆</div><div class="body">
      <h1 class="meet-name">${esc(l.name)}</h1>
      <div class="meet-meta"><span><b>${l.table.length}</b> teams</span>
        <span class="prog"><span class="bar"><i style="width:${l.fixtures.length ? Math.round(played / l.fixtures.length * 100) : 0}%"></i></span><b>${played}/${l.fixtures.length}</b> matches</span></div>
    </div></div>`;
  // A league match on track right now goes in the big panel.
  const liveMatch = data.competitions.find(c => c.state === "running" && l.fixtures.some(f => f.competition === c.name));
  $("spot").innerHTML = liveMatch && liveMatch.team ? `<div class="card spot live" style="cursor:pointer" onclick="chosen='${esc(liveMatch.name)}';render()">
      ${tagbar("Live match", `<span class="dot"></span>Watch`, true)}
      <div class="fx" style="border:0"><span></span><span class="h">${esc(liveMatch.team.homeName)}</span>
      <span class="s">${liveMatch.team.home} : ${liveMatch.team.away}</span><span class="a">${esc(liveMatch.team.awayName)}</span></div></div>` : "";
  if (tab === "standings") renderLeagueTable(l);
  if (tab === "program") renderFixtures(l);
  if (tab === "results") renderLeagueStats(l);
}

function renderLeagueTable(l) {
  if (!l.table.length) { $("view").innerHTML = `<div class="card empty">No teams yet.</div>`; return; }
  const n = l.table.length;
  $("view").innerHTML = `<div class="card">${tagbar("Table", `${l.fixtures.filter(f => f.played && f.stage === "regular").length} played`)}
    <div class="xscroll"><table class="ltable">
      <tr><th></th><th>Team</th><th>M</th><th>W</th><th>D</th><th>L</th><th>Bonus</th><th>+/-</th><th>Pts</th></tr>
      ${l.table.map(r => `<tr class="${n >= 4 && r.pos <= 4 ? "pa" : n >= 8 && r.pos <= 8 ? "pb" : ""}">
        <td class="pos">${r.pos}</td><td>${esc(r.team)}</td><td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td>
        <td>${r.bonus}</td><td>${r.race > 0 ? "+" : ""}${r.race}</td><td class="pts">${r.points}</td></tr>`).join("")}
    </table></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Play-offs (group A)</span>${n >= 8 ? `<span><i style="background:var(--purple-hi)"></i>Play-down (group B)</span>` : ""}
      <span>Win 2 · draw 1 · +1 bonus for winning both legs together</span></div>
  </div>`;
}

function renderFixtures(l) {
  if (!l.fixtures.length) { $("view").innerHTML = `<div class="card empty">No fixtures yet.</div>`; return; }
  const rounds = [...new Set(l.fixtures.map(f => f.round))];
  const running = new Set(data.competitions.filter(c => c.state === "running").map(c => c.name));
  $("view").innerHTML = `<div class="card">${tagbar("Fixtures", `${l.fixtures.filter(f => f.played).length}/${l.fixtures.length}`)}
    ${rounds.map(r => {
      const fs = l.fixtures.filter(f => f.round === r);
      const label = fs[0].tie ? `Round ${r} · Play-offs` : `Round ${r}`;
      return `<div class="stage">${label}</div>` + fs.map(f => {
        const live = f.competition && running.has(f.competition);
        const comp = live ? data.competitions.find(c => c.name === f.competition) : null;
        let score = `<span class="s vs">${live ? "" : "vs"}</span>`;
        if (f.played) score = `<span class="s">${f.homePoints} : ${f.awayPoints}${f.walkover ? "<small>walkover</small>" : f.tie ? `<small>${esc(f.tie)}</small>` : ""}</span>`;
        else if (comp && comp.team) score = `<span class="s">${comp.team.home} : ${comp.team.away}<small style="color:var(--live)">● live</small></span>`;
        const win = f.played ? (f.homePoints > f.awayPoints ? "win-h" : f.awayPoints > f.homePoints ? "win-a" : "") : "";
        return `<div class="fx ${live ? "live" : ""} ${win}" ${f.competition && data.competitions.some(c => c.name === f.competition) ? `onclick="chosen='${esc(f.competition)}';render()" style="cursor:pointer"` : ""}>
          <span class="id">#${f.id}</span><span class="h">${esc(f.home)}</span>${score}<span class="a">${esc(f.away)}</span></div>`;
      }).join("");
    }).join("")}
  </div>`;
}

function renderLeagueStats(l) {
  if (!l.stats.length) { $("view").innerHTML = `<div class="card empty">No matches played yet.</div>`; return; }
  const row = (s, i) => `<tr><td>${i}</td><td class="nm">${esc(s.name)}</td><td class="tm">${esc(s.team)}</td><td>${s.matches}</td><td>${s.heats}</td>
      ${s.places.map(x => `<td>${x}</td>`).join("")}${s.codes.map(x => `<td style="color:${x ? "var(--red)" : "var(--faint)"}">${x}</td>`).join("")}
      <td>${s.points}</td><td>${s.bonus}</td><td><b>${s.total}</b></td><td class="avg">${s.perHeat.toFixed(3)}</td><td>${s.perMatch.toFixed(3)}</td><td>${s.home.toFixed(3)}</td><td>${s.away.toFixed(3)}</td></tr>`;
  const cls = l.stats.filter(s => s.classified), un = l.stats.filter(s => !s.classified);
  $("view").innerHTML = `<div class="card">${tagbar("Rider stats", `min ${l.classifiedHeats} heats`)}
    <div class="xscroll"><table class="lstats">
      <tr><th></th><th>Rider</th><th>Team</th><th>M</th><th>Heats</th><th>1</th><th>2</th><th>3</th><th>4</th><th>D</th><th>U</th><th>W</th><th>T</th><th>Pts</th><th>Bonus</th><th>Total</th><th>Avg</th><th>/match</th><th>Home</th><th>Away</th></tr>
      ${cls.map((s, i) => row(s, i + 1)).join("")}
      ${un.length ? `<tr class="sep"><td colspan="20">Not classified yet</td></tr>` + un.map((s, i) => row(s, cls.length + i + 1)).join("") : ""}
    </table></div>
    <div class="legend"><span>Avg = (points + bonus) per heat</span><span>/match = per match</span>${Object.entries(CODES).map(([k, v]) => `<span><b>${k}</b>${v}</span>`).join("")}</div>
  </div>`;
}

$("picker").addEventListener("change", e => { chosen = e.target.value; render(); });
function setTab(name) {
  tab = name;
  history.replaceState(null, "", "#" + name);
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  render();
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
setTab(tab);
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
